<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reading Speed — Flash reader</title>
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <header class="topbar">
    <span class="nav">← Games</span>
    <div class="topbar-title">Reading Speed</div>
    <span class="topbar-right nav">Log out</span>
  </header>
  <main class="page flash-page">
    <div class="flash-top">
      <div class="flash-hud-bit">
        <span class="flash-hud-l">Passage</span>
        <span class="flash-hud-v" style="font-size:1rem">Wolf Island</span>
      </div>
      <div class="flash-passage-name">
        <div class="kicker">One word at a time · eyes on the red letter</div>
        <h2>Flash practice</h2>
      </div>
      <div class="flash-hud-bit">
        <span class="flash-hud-l">Speed</span>
        <span class="flash-hud-v">60 wpm</span>
      </div>
    </div>

    <section class="word-card">
      <div class="word">is<span class="focus">l</span>and</div>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span>Word 42 of 180</span>
          <span>23% through</span>
        </div>
        <div class="bar"><span></span></div>
      </div>
    </section>

    <section class="controls">
      <div class="ctrl-left">
        <button class="btn">⟲ Back a phrase</button>
      </div>
      <div class="speed">
        <div class="speed-title">Speed: <span>60</span> wpm</div>
        <div class="speed-row">
          <label>40</label>
          <input type="range" min="40" max="200" step="5" value="60" aria-label="Speed in words per minute, 40 to 200">
          <label class="end">200</label>
        </div>
      </div>
      <div class="ctrl-right">
        <button class="btn primary">❚❚ Pause</button>
        <div class="nudge">⭐ Level up? Try 65!</div>
      </div>
    </section>
    <div class="footer">Mockup, example numbers</div>
  </main>
</body>
</html>
