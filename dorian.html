<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi, Dorian!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>JU.auth.require(['dorian', 'parent']);</script>
</head>
<body class="kid">
  <div id="parent-bar" class="parent-bar" hidden><a class="btn small ghost" href="parent.html?p=dorian">&larr; Grown-up page</a></div>
  <main class="kid-home">
    <h1 class="kid-hello"><span id="kid-star" aria-hidden="true">&#128075;</span> Hi, Dorian!</h1>
    <div class="kid-stage" id="kid-stage" role="button" tabindex="0" aria-label="Hi Dorian">&#128640;</div>
    <p class="kid-soon">Tap a picture to play! <span aria-hidden="true">&#127880;</span></p>
    <div id="kid-kinder" class="kid-money kid-kinder" role="group" aria-label="Letters, words and numbers">
      <a class="kid-btn kid-act" href="kinder.html?a=letters" data-act="letters" data-say="Letter sounds" aria-label="Letter sounds"><span class="kid-pic" aria-hidden="true">&#128292;</span></a>
      <a class="kid-btn kid-act" href="kinder.html?a=build" data-act="build" data-say="Build a word" aria-label="Build a word"><span class="kid-pic" aria-hidden="true">&#129521;</span></a>
      <a class="kid-btn kid-act" href="kinder.html?a=sight" data-act="sight" data-say="Sight words" aria-label="Sight words"><span class="kid-pic" aria-hidden="true">&#128064;</span></a>
      <a class="kid-btn kid-act" href="kinder.html?a=count" data-act="count" data-say="Count to twenty" aria-label="Count to twenty"><span class="kid-pic" aria-hidden="true">&#128290;</span></a>
      <a class="kid-btn kid-act" href="kinder.html?a=add" data-act="add" data-say="Add it up" aria-label="Add it up"><span class="kid-pic" aria-hidden="true">&#129518;</span></a>
    </div>
    <div id="kid-money" class="kid-money" role="group" aria-label="Money activities" hidden></div>
    <div id="kid-stickers" class="kid-stickers" role="group" aria-label="Your stickers" hidden></div>
    <div class="kid-buttons">
      <button type="button" class="kid-btn" id="hear" aria-label="Hear it again">
        <span class="kid-pic" aria-hidden="true">&#128266;</span>
      </button>
      <button type="button" class="kid-btn" id="bye" aria-label="Bye bye, log out">
        <span class="kid-pic" aria-hidden="true">&#128075;</span>
      </button>
    </div>
  </main>
  <script src="js/ui.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/recordings.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/money.js"></script>
  <script src="js/kinder.js"></script>
  <script src="js/kinder/play.js"></script>
  <script src="js/pages/dorian.js"></script>
</body>
</html>
